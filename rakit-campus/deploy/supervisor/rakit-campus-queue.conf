[program:rakit-campus-queue]
command=php /var/www/rakit-campus/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default,notifications,matchmaking
directory=/var/www/rakit-campus
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/rakit-campus-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
