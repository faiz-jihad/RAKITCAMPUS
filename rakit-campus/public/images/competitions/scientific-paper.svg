<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="emeraldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sciGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sciGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" /><line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" /><line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" /><line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" /><line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Orbital Scientific Geometry -->
  <g stroke="#6ee7b7" stroke-width="1.5" stroke-opacity="0.4" fill="none">
    <ellipse cx="400" cy="225" rx="220" ry="80" transform="rotate(-25 400 225)" />
    <ellipse cx="400" cy="225" rx="220" ry="80" transform="rotate(35 400 225)" />
    <ellipse cx="400" cy="225" rx="220" ry="80" transform="rotate(95 400 225)" />
  </g>

  <!-- Nucleus / Core Atom -->
  <circle cx="400" cy="225" r="28" fill="#10b981" filter="url(#sciGlow)" />
  <circle cx="400" cy="225" r="18" fill="#a7f3d0" />
  <circle cx="400" cy="225" r="8" fill="#ffffff" />

  <!-- Orbiting particles -->
  <circle cx="210" cy="140" r="7" fill="#6ee7b7" filter="url(#sciGlow)" />
  <circle cx="580" cy="300" r="7" fill="#34d399" filter="url(#sciGlow)" />
  <circle cx="470" cy="110" r="6" fill="#a7f3d0" />
  <circle cx="330" cy="340" r="6" fill="#6ee7b7" />

  <!-- Research & Publication Badge Graphic -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#34d399" stroke-width="1" />
    <text x="65" y="18" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SCIENTIFIC PAPER</text>
  </g>

  <!-- Title Watermark -->
  <text x="60" y="380" fill="#ffffff" fill-opacity="0.9" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">LKTIN & Riset Nasional</text>
  <text x="60" y="405" fill="#6ee7b7" fill-opacity="0.8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Publikasi Ilmiah & Inovasi Akademik</text>
</svg>
