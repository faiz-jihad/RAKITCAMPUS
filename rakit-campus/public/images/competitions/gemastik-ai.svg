<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#aiGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" /><line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" /><line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" /><line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" /><line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" /><line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Neural Network Mesh & Connections -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="160" y1="180" x2="280" y2="120" />
    <line x1="160" y1="180" x2="260" y2="260" />
    <line x1="280" y1="120" x2="420" y2="160" />
    <line x1="260" y1="260" x2="420" y2="160" />
    <line x1="420" y1="160" x2="540" y2="100" />
    <line x1="420" y1="160" x2="520" y2="240" />
    <line x1="540" y1="100" x2="660" y2="180" />
    <line x1="520" y1="240" x2="660" y2="180" />
    <line x1="280" y1="120" x2="540" y2="100" stroke-dasharray="4,4" />
    <line x1="260" y1="260" x2="520" y2="240" stroke-dasharray="4,4" />
  </g>

  <!-- Glowing Nodes -->
  <circle cx="160" cy="180" r="10" fill="#0284c7" filter="url(#glow)" />
  <circle cx="160" cy="180" r="6" fill="#e0f2fe" />
  <circle cx="280" cy="120" r="12" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="280" cy="120" r="7" fill="#ffffff" />
  <circle cx="260" cy="260" r="10" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="260" cy="260" r="6" fill="#e0f2fe" />
  <circle cx="420" cy="160" r="22" fill="#6366f1" filter="url(#glow)" />
  <circle cx="420" cy="160" r="12" fill="#a5b4fc" />
  <circle cx="420" cy="160" r="6" fill="#ffffff" />
  <circle cx="540" cy="100" r="12" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="540" cy="100" r="7" fill="#ffffff" />
  <circle cx="520" cy="240" r="10" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="520" cy="240" r="6" fill="#e0f2fe" />
  <circle cx="660" cy="180" r="10" fill="#0284c7" filter="url(#glow)" />
  <circle cx="660" cy="180" r="6" fill="#e0f2fe" />

  <!-- Central Emblem / Vector Badge -->
  <g transform="translate(320, 270)">
    <rect width="160" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">GEMASTIK AI 2026</text>
  </g>
</svg>
