<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pkmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#pkmGrad)" />

  <!-- Growth / Financial Graph Motif in Background -->
  <path d="M100 320 Q 250 300, 380 220 T 700 120" stroke="#fcd34d" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8,6" />
  
  <!-- Lightbulb / Innovation Idea Emblem -->
  <g transform="translate(350, 120)">
    <!-- Bulb Glow Halo -->
    <circle cx="50" cy="65" r="45" fill="#f59e0b" fill-opacity="0.25" filter="url(#goldGlow)" />
    
    <!-- Bulb Glass -->
    <path d="M25 60 C25 35 35 20 50 20 C65 20 75 35 75 60 C75 75 65 85 62 95 L38 95 C35 85 25 75 25 60 Z" fill="#fbbf24" stroke="#fde68a" stroke-width="2.5" />
    <!-- Filament -->
    <path d="M43 70 L47 50 L53 50 L57 70" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Screw Base -->
    <rect x="40" y="98" width="20" height="4" rx="2" fill="#d97706" />
    <rect x="42" y="104" width="16" height="4" rx="2" fill="#d97706" />
    <rect x="45" y="110" width="10" height="4" rx="2" fill="#b45309" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(290, 290)">
    <rect width="220" height="36" rx="18" fill="#451a03" fill-opacity="0.85" stroke="#fcd34d" stroke-width="1.5" />
    <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="2">PKM KEWIRAUSAHAAN</text>
  </g>
</svg>
