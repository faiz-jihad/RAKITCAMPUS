<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uiuxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#uiuxGrad)" />

  <!-- Bezier Curve & Pen tool wireframe -->
  <path d="M120 320 C 250 100, 550 350, 680 140" stroke="#e9d5ff" stroke-width="3" fill="none" opacity="0.4" />
  <circle cx="250" cy="100" r="6" fill="#f43f5e" />
  <circle cx="550" cy="350" r="6" fill="#f43f5e" />
  <line x1="250" y1="100" x2="300" y2="160" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Pen tool / Layer icon -->
  <g transform="translate(360, 130)">
    <!-- Palette swatches -->
    <rect x="-30" y="30" width="30" height="40" rx="8" fill="#ec4899" transform="rotate(-15)" filter="url(#purpleGlow)" />
    <rect x="70" y="20" width="30" height="40" rx="8" fill="#06b6d4" transform="rotate(15)" filter="url(#purpleGlow)" />
    
    <!-- Central Pen Tool -->
    <path d="M40 0 L55 35 L40 50 L25 35 Z" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
    <circle cx="40" cy="30" r="3" fill="#6b21a8" />
    <line x1="40" y1="30" x2="40" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(290, 290)">
    <rect width="220" height="36" rx="18" fill="#3b0764" fill-opacity="0.85" stroke="#d8b4fe" stroke-width="1.5" />
    <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f3e8ff" text-anchor="middle" letter-spacing="2">GLOBAL UI/UX SPRINT</text>
  </g>
</svg>
