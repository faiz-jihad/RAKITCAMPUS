<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#hackGrad)" />

  <!-- Code brackets background motif -->
  <g stroke="#60a5fa" stroke-opacity="0.12" stroke-width="4" fill="none">
    <path d="M120 150 L60 225 L120 300" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M680 150 L740 225 L680 300" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Speed lines / Energy trails -->
  <g stroke="#93c5fd" stroke-opacity="0.3" stroke-width="2">
    <line x1="200" y1="280" x2="350" y2="280" stroke-dasharray="12,8" />
    <line x1="160" y1="260" x2="310" y2="260" stroke-dasharray="20,12" />
    <line x1="450" y1="220" x2="620" y2="220" stroke-dasharray="16,8" />
  </g>

  <!-- Rocket / Fast Build Motif -->
  <g transform="translate(350, 110)">
    <!-- Rocket Thruster Fire -->
    <path d="M40 160 L50 200 L60 160 Z" fill="#f59e0b" filter="url(#blueGlow)" />
    <path d="M44 160 L50 185 L56 160 Z" fill="#fef08a" />
    
    <!-- Rocket Body -->
    <path d="M25 150 L50 40 L75 150 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="2" />
    <!-- Fin Left & Right -->
    <path d="M25 120 L5 155 L25 150 Z" fill="#1d4ed8" />
    <path d="M75 120 L95 155 L75 150 Z" fill="#1d4ed8" />
    
    <!-- Window -->
    <circle cx="50" cy="85" r="14" fill="#1e1b4b" stroke="#93c5fd" stroke-width="2" />
    <circle cx="50" cy="85" r="9" fill="#38bdf8" />
    <circle cx="52" cy="82" r="3" fill="#ffffff" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(290, 310)">
    <rect width="220" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#60a5fa" stroke-width="1.5" />
    <text x="110" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="2">HACKATHON CAMP 2026</text>
  </g>
</svg>
