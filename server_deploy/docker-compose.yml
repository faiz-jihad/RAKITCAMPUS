version: '3.8'

services:
  app:
    build:
      context: ../rakit-campus
      dockerfile: ../server_deploy/Dockerfile
    container_name: rakit_campus_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../rakit-campus:/var/www
      - ../rakit-campus/storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rakit_campus
      - DB_USERNAME=rakit
      - DB_PASSWORD=secret_password_here
    depends_on:
      - db
      - redis
    networks:
      - rakit_network

  web:
    image: nginx:alpine
    container_name: rakit_campus_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../rakit-campus:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - rakit_network

  db:
    image: mysql:8.0
    container_name: rakit_campus_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rakit_campus
      MYSQL_USER: rakit
      MYSQL_PASSWORD: secret_password_here
      MYSQL_ROOT_PASSWORD: root_secret_password_here
    volumes:
      - rakit_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - rakit_network

  redis:
    image: redis:alpine
    container_name: rakit_campus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - rakit_network

networks:
  rakit_network:
    driver: bridge

volumes:
  rakit_db_data:
    driver: local
