version: '3.8'

services:
  app:
    build:
      context: ../rakit-campus
      dockerfile: ../server_deploy/Dockerfile
    container_name: rakit_campus_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../rakit-campus:/var/www
      - ./uploads.ini:/usr/local/etc/php/conf.d/docker-php-uploads.ini:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rakit_campus
      - DB_USERNAME=rakit
      - DB_PASSWORD=@Hackathon123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - rakit_network

  redis:
    image: redis:alpine
    container_name: rakit_campus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "@Hackathon123"
    volumes:
      - rakit_redis_data:/data
    networks:
      - rakit_network

  web:
    image: nginx:alpine
    container_name: rakit_campus_web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ../rakit-campus:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rakit_network

  db:
    image: mysql:8.0
    container_name: rakit_campus_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: rakit_campus
      MYSQL_USER: rakit
      MYSQL_PASSWORD: "@Hackathon123"
      MYSQL_ROOT_PASSWORD: "@Hackathon123_root"
    volumes:
      - rakit_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p@Hackathon123_root"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rakit_network

networks:
  rakit_network:
    name: rakit_campus_network
    driver: bridge

volumes:
  rakit_db_data:
    driver: local
  rakit_redis_data:
    driver: local
