# ==============================================================================
# RAKIT Campus — Domains: rakitcampus.my.id, www.rakitcampus.my.id, rakitcampus.mataceria.my.id
# Cloudflare Flexible/Full SSL: user <-HTTPS-> Cloudflare <-HTTP/HTTPS-> server
# ==============================================================================

upstream rakit_web {
    server 172.17.0.1:8088;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rakitcampus.my.id www.rakitcampus.my.id rakitcampus.mataceria.my.id;

    client_max_body_size 250M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # S3 Object Storage endpoint proxy for public downloads / attachments
    location /storage-obj/ {
        proxy_pass         http://retiva-minio:9000/rakitcampus-files/;
        proxy_http_version 1.1;
        proxy_redirect     off;
        proxy_set_header   Host              retiva-minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        client_max_body_size 250M;
    }

    location / {
        proxy_pass         http://rakit_web;
        proxy_http_version 1.1;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rakitcampus.my.id www.rakitcampus.my.id rakitcampus.mataceria.my.id;

    ssl_certificate     /etc/letsencrypt/rakitcampus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/rakitcampus/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 250M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # S3 Object Storage endpoint proxy for public downloads / attachments
    location /storage-obj/ {
        proxy_pass         http://retiva-minio:9000/rakitcampus-files/;
        proxy_http_version 1.1;
        proxy_redirect     off;
        proxy_set_header   Host              retiva-minio:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        client_max_body_size 250M;
    }

    location / {
        proxy_pass         http://rakit_web;
        proxy_http_version 1.1;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
}
