server {
    listen 80;
    listen [::]:80;

    server_name rakitcampus.my.id www.rakitcampus.my.id rakitcampus.mataceria.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://rakitcampus.my.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.rakitcampus.my.id rakitcampus.mataceria.my.id;

    ssl_certificate /etc/nginx/ssl/rakit/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/rakit/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rakitcampus.my.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name rakitcampus.my.id;

    ssl_certificate /etc/nginx/ssl/rakit/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/rakit/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host rakitcampus.my.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host rakitcampus.my.id;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
